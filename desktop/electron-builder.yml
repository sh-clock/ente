appId: com.shclock.photos
artifactName: ${productName}-${version}-${arch}.${ext}
files:
    - app/**/*
    - out
extraFiles:
    - from: build
      to: resources
      filter: ["**/*", "!ffmpeg/{ffprobe,ffprobe.exe,.archive-sha256}"]
beforeBuild: scripts/beforeBuild.js
beforePack: scripts/beforePack.js
protocols:
    - name: Photos
      schemes: ["photos"]
win:
    target:
        - target: zip
          arch: [x64]
linux:
    target:
        - target: AppImage
          arch: [x64, arm64]
        - target: deb
          arch: [x64, arm64]
        - target: rpm
          arch: [x64, arm64]
        - target: pacman
          arch: [x64, arm64]
    category: Photography
    icon: ./build/icon.png
# Remove this override when upgrading electron-builder to 27.0.0.
pacman:
    depends:
        - c-ares
        - ffmpeg
        - gtk3
        - libevent
        - libvpx
        - libxslt
        - libxss
        - minizip
        - nss
        - re2
        - snappy
        - libnotify
        - libappindicator-gtk3
