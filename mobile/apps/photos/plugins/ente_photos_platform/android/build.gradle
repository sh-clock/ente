plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group 'com.shclock.photos.platform'
version '1.0'

android {
    namespace 'com.shclock.photos.platform'

    defaultConfig {
        minSdkVersion 23
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
