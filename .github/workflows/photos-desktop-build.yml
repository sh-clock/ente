name: "Build (Photos Desktop)"

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - "surgery/**"
        paths:
            - desktop/**
            - web/**
            - rust/**
            - .github/workflows/photos-desktop-build.yml

concurrency:
    group: photos-desktop-build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      targets: --windows
                      artifact: windows-portable-zip
                    - os: ubuntu-latest
                      targets: --linux AppImage deb
                      artifact: linux-x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        defaults:
            run:
                working-directory: desktop

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@0822f6eae27bc1b603a860c0e08fd0bf79cdd629 # v6.0.0
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: desktop/package-lock.json

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Rust cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  shared-key: photos-desktop

            - name: Free disk space
              if: runner.os == 'Linux'
              shell: bash
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android

            - name: Install desktop dependencies
              run: npm ci

            - name: Postinstall (native binaries: ort/vips/ffmpeg)
              run: npm run postinstall

            - name: Build (renderer + main + napi)
              run: npm run build:ci
              env:
                  CARGO_TERM_COLOR: always

            - name: Package
              run: npx electron-builder ${{ matrix.targets }} --publish never

            - name: Upload artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: photos-desktop-${{ matrix.artifact }}
                  path: |
                      desktop/dist/*.zip
                      desktop/dist/*.AppImage
                      desktop/dist/*.deb
                  if-no-files-found: error
                  retention-days: 14
