name: CI

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    select:
        name: Select CI
        runs-on: ubuntu-latest
        outputs:
            jobs: ${{ steps.select.outputs.jobs }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 2
                  persist-credentials: false
            - id: select
              run: node .github/scripts/ci/check.mjs select HEAD^1 HEAD

    desktop-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'desktop-lint') }}
        uses: ./.github/workflows/desktop-lint.yml

    mobile-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'mobile-lint') }}
        uses: ./.github/workflows/mobile-lint.yml

    rust-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'rust-lint') }}
        uses: ./.github/workflows/rust-lint.yml

    rust-test:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'rust-test') }}
        uses: ./.github/workflows/rust-test.yml

    web-lint:
        needs: select
        if: ${{ contains(fromJSON(needs.select.outputs.jobs), 'web-lint') }}
        uses: ./.github/workflows/web-lint.yml

    required:
        name: CI required
        if: ${{ always() }}
        needs:
            - select
            - desktop-lint
            - mobile-lint
            - rust-lint
            - rust-test
            - web-lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: node .github/scripts/ci/check.mjs result
              env:
                  NEEDS: ${{ toJSON(needs) }}
